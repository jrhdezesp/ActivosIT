name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.0', '8.2', '8.3' ]

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql
          coverage: none

      - name: Validar composer.json
        run: composer validate --strict --no-interaction

      - name: Generar autoload
        run: composer dump-autoload --optimize --no-scripts --no-interaction

      - name: Revisar sintaxis y JSON
        run: php scripts/lint.php

      - name: Detectar archivos de configuración rastreados
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(parameters\.env|\.env)(\.|$)|(^|/)renameTo_parameters\.env$'; then
            echo "No se permiten archivos de configuración rastreados."
            exit 1
          fi
