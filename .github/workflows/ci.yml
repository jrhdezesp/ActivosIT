# Integracion continua de ActivosIT.
# Ejecuta validaciones de Composer y sintaxis en cada push o pull request.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.0', '8.2', '8.3', '8.4', '8.5' ]

    permissions:
      contents: read

    steps:
      # Descarga el codigo del repositorio.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Prepara la version de PHP y las extensiones necesarias.
      - name: Configurar PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql
          coverage: none

      # Valida el archivo de dependencias del proyecto.
      - name: Validar composer.json
        run: composer validate --strict --no-interaction

      # Genera el autoload sin ejecutar scripts adicionales.
      - name: Generar autoload
        run: composer dump-autoload --optimize --no-scripts --no-interaction

      # Revisa la sintaxis PHP y la validez de los JSON.
      - name: Revisar sintaxis y JSON
        run: php scripts/lint.php

      # Evita que se versionen archivos con credenciales o configuracion local.
      - name: Detectar archivos de configuracion rastreados
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(parameters\.env|\.env)(\.|$)|(^|/)renameTo_parameters\.env$'; then
            echo "No se permiten archivos de configuración rastreados."
            exit 1
          fi
